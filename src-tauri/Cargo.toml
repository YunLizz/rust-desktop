[package]
name = "jinshu"
version = "0.1.0"
edition = "2021"
description = "锦书 · 小说编辑器（Tauri：Rust 后端 + Web 前端）"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
rand = "0.8"
ureq = { version = "2", features = ["json"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
scrypt = "0.11"
flate2 = "1"

[profile.release]
lto = "thin"
opt-level = 3
